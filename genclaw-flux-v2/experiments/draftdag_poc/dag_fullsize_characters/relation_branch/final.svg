<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="white"/>

  <!-- LEFT ZONE: Woman, hose, water arc, bike, fence -->

  <!-- Woman: simplified bending pose -->
  <!-- Head -->
  <circle cx="400" cy="460" r="24" fill="#FFDAB9"/>
  <!-- Torso (bent forward ellipse) -->
  <ellipse cx="400" cy="540" rx="20" ry="48" fill="#FFB6C1" transform="rotate(-25 400 540)"/>
  <!-- Bent arm (line from shoulder to hand) -->
  <line x1="400" y1="500" x2="440" y2="540" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
  <!-- Hand (red circle at nozzle) -->
  <circle cx="440" cy="540" r="12" fill="#FF6B6B"/>

  <!-- Hose nozzle -->
  <rect x="428" y="528" width="24" height="16" fill="#FF6B6B" rx="3"/>

  <!-- Water arc (light blue smooth curve) -->
  <path d="M 440 544 C 380 420, 500 360, 560 440" fill="none" stroke="#4ECDC4" stroke-width="12" stroke-linecap="round"/>

  <!-- Bicycle (leaning right) -->
  <!-- Rear wheel -->
  <circle cx="520" cy="660" r="32" fill="none" stroke="#333" stroke-width="6"/>
  <!-- Front wheel -->
  <circle cx="620" cy="660" r="32" fill="none" stroke="#333" stroke-width="6"/>
  <!-- Frame: seat tube, top tube, down tube -->
  <line x1="520" y1="628" x2="580" y2="520" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <line x1="580" y1="520" x2="620" y2="628" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <line x1="520" y1="628" x2="620" y2="628" stroke="#333" stroke-width="6" stroke-linecap="round"/>

  <!-- Short fence segment -->
  <!-- Posts -->
  <rect x="670" y="600" width="8" height="100" fill="#8B4513"/>
  <rect x="695" y="600" width="8" height="100" fill="#8B4513"/>
  <rect x="720" y="600" width="8" height="100" fill="#8B4513"/>
  <!-- Rail -->
  <rect x="670" y="630" width="58" height="12" fill="#8B4513"/>

  <!-- RIGHT ZONE: Dog, oak, cat, truck, ball, ladybug chain, drone -->

  <!-- Oak trunk -->
  <rect x="1040" y="200" width="20" height="500" fill="#8B4513"/>

  <!-- Terrier digging at base -->
  <!-- Body -->
  <ellipse cx="1080" cy="680" rx="36" ry="24" fill="#8B4513"/>
  <!-- Head -->
  <circle cx="1110" cy="660" r="16" fill="#8B4513"/>
  <!-- Front paws (raised digging) -->
  <line x1="1070" y1="700" x2="1050" y2="670" stroke="#5D4037" stroke-width="10" stroke-linecap="round"/>
  <line x1="1090" y1="700" x2="1110" y2="670" stroke="#5D4037" stroke-width="10" stroke-linecap="round"/>

  <!-- Pickup truck -->
  <!-- Bed (trapezoid) -->
  <polygon points="1180,560 1420,560 1380,660 1220,660" fill="#45B7D1"/>
  <!-- Cab -->
  <rect x="1220" y="440" width="120" height="120" fill="#45B7D1" rx="8"/>
  <!-- Wheels -->
  <circle cx="1240" cy="660" r="24" fill="black"/>
  <circle cx="1360" cy="660" r="24" fill="black"/>

  <!-- Cat on truck hood -->
  <ellipse cx="1270" cy="420" rx="28" ry="18" fill="#95A5A6"/>
  <!-- Cat paws (on hood surface) -->
  <line x1="1250" y1="438" x2="1240" y2="450" stroke="#7F8C8D" stroke-width="6" stroke-linecap="round"/>
  <line x1="1290" y1="438" x2="1300" y2="450" stroke="#7F8C8D" stroke-width="6" stroke-linecap="round"/>

  <!-- Tennis ball -->
  <circle cx="1380" cy="520" r="30" fill="#FF6B6B"/>

  <!-- Ladybug chain: 7 alternating red/black circles, linked -->
  <!-- Coordinates approximated along smooth curve from (1030,340) to (1380,520) -->
  <circle cx="1030" cy="340" r="8" fill="#FF6B6B"/>
  <circle cx="1080" cy="370" r="8" fill="#000000"/>
  <circle cx="1130" cy="400" r="8" fill="#FF6B6B"/>
  <circle cx="1180" cy="430" r="8" fill="#000000"/>
  <circle cx="1230" cy="460" r="8" fill="#FF6B6B"/>
  <circle cx="1280" cy="490" r="8" fill="#000000"/>
  <circle cx="1330" cy="510" r="8" fill="#FF6B6B"/>
  <!-- Connecting lines -->
  <line x1="1030" y1="340" x2="1080" y2="370" stroke="#000000" stroke-width="2"/>
  <line x1="1080" y1="370" x2="1130" y2="400" stroke="#000000" stroke-width="2"/>
  <line x1="1130" y1="400" x2="1180" y2="430" stroke="#000000" stroke-width="2"/>
  <line x1="1180" y1="430" x2="1230" y2="460" stroke="#000000" stroke-width="2"/>
  <line x1="1230" y1="460" x2="1280" y2="490" stroke="#000000" stroke-width="2"/>
  <line x1="1280" y1="490" x2="1330" y2="510" stroke="#000000" stroke-width="2"/>

  <!-- Drone (above right zone) -->
  <!-- Body -->
  <rect x="1195" y="175" width="10" height="10" fill="#7F8C8D" rx="2"/>
  <!-- Rotors -->
  <line x1="1195" y1="175" x2="1175" y2="155" stroke="#7F8C8D" stroke-width="4" stroke-linecap="round"/>
  <line x1="1205" y1="175" x2="1225" y2="155" stroke="#7F8C8D" stroke-width="4" stroke-linecap="round"/>
  <line x1="1195" y1="185" x2="1175" y2="205" stroke="#7F8C8D" stroke-width="4" stroke-linecap="round"/>
  <line x1="1205" y1="185" x2="1225" y2="205" stroke="#7F8C8D" stroke-width="4" stroke-linecap="round"/>
</svg>