<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1600" height="900" fill="#E0F7FA" />
  
  <!-- Grass band -->
  <rect x="0" y="750" width="1600" height="150" fill="#4CAF50" />
  
  <!-- Terrier body (tan oval) -->
  <ellipse cx="800" cy="625" rx="200" ry="125" fill="#90A4AE" />
  
  <!-- Terrier head (tan circle) -->
  <circle cx="800" cy="400" r="60" fill="#90A4AE" />
  
  <!-- Left front leg (brown rectangle, angled forward) -->
  <rect x="750" y="420" width="20" height="160" fill="#5D4037" transform="rotate(-15 760 500)" />
  
  <!-- Right front leg (brown rectangle, angled forward) -->
  <rect x="830" y="420" width="20" height="160" fill="#5D4037" transform="rotate(15 840 500)" />
  
  <!-- Left hind leg (brown rectangle, angled back) -->
  <rect x="700" y="580" width="20" height="140" fill="#5D4037" transform="rotate(-20 710 650)" />
  
  <!-- Right hind leg (brown rectangle, angled back) -->
  <rect x="880" y="580" width="20" height="140" fill="#5D4037" transform="rotate(20 890 650)" />
  
  <!-- Brown leather harness strap (horizontal chest band) -->
  <rect x="700" y="520" width="200" height="20" fill="#5D4037" />
  
  <!-- Harness buckle (small centered square) -->
  <rect x="790" y="515" width="20" height="20" fill="#8D6E63" />
</svg>