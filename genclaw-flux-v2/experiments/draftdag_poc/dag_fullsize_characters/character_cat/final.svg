<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1600" height="780" y="0" fill="#e0f7fa" />
  
  <!-- Grass band base -->
  <rect width="1600" height="120" y="780" fill="#4caf50" />
  
  <!-- Grass strokes (14 vertical blades) -->
  <rect x="120" y="780" width="8" height="25" fill="#388e3c" />
  <rect x="280" y="780" width="8" height="22" fill="#388e3c" />
  <rect x="440" y="780" width="8" height="24" fill="#388e3c" />
  <rect x="600" y="780" width="8" height="20" fill="#388e3c" />
  <rect x="760" y="780" width="8" height="26" fill="#388e3c" />
  <rect x="920" y="780" width="8" height="23" fill="#388e3c" />
  <rect x="1080" y="780" width="8" height="21" fill="#388e3c" />
  <rect x="1240" y="780" width="8" height="25" fill="#388e3c" />
  <rect x="1400" y="780" width="8" height="22" fill="#388e3c" />
  <rect x="1520" y="780" width="8" height="24" fill="#388e3c" />
  <rect x="200" y="780" width="8" height="23" fill="#388e3c" />
  <rect x="520" y="780" width="8" height="21" fill="#388e3c" />
  <rect x="840" y="780" width="8" height="25" fill="#388e3c" />
  <rect x="1160" y="780" width="8" height="22" fill="#388e3c" />
  
  <!-- Cat body (vertical oval) -->
  <ellipse cx="750" cy="470" rx="210" ry="190" fill="#5d4037" />
  
  <!-- Cat head (oval) -->
  <ellipse cx="750" cy="280" rx="130" ry="120" fill="#5d4037" />
  
  <!-- Left ear (triangle) -->
  <polygon points="680,160 700,120 720,160" fill="#5d4037" />
  
  <!-- Right ear (triangle) -->
  <polygon points="780,160 800,120 820,160" fill="#5d4037" />
  
  <!-- Left front paw -->
  <ellipse cx="680" cy="640" rx="40" ry="20" fill="#5d4037" />
  
  <!-- Right front paw -->
  <ellipse cx="840" cy="640" rx="40" ry="20" fill="#5d4037" />
  
  <!-- Left rear paw hint -->
  <rect x="690" y="660" width="20" height="20" fill="#5d4037" />
  
  <!-- Right rear paw hint -->
  <rect x="790" y="660" width="20" height="20" fill="#5d4037" />
</svg>