<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1600" height="750" y="0" fill="#E0F7FA" />
  <!-- Grass background -->
  <rect width="1600" height="150" y="750" fill="#4CAF50" />
  <!-- Dog body (torso) -->
  <ellipse cx="800" cy="525" rx="200" ry="125" fill="#FFD700" />
  <!-- Head -->
  <rect x="720" y="280" width="160" height="140" rx="70" ry="70" fill="#FFD700" />
  <!-- Left floppy ear -->
  <ellipse cx="750" cy="280" rx="70" ry="60" fill="#FFD700" transform="rotate(-30 750 280)" />
  <!-- Right floppy ear -->
  <ellipse cx="850" cy="280" rx="70" ry="60" fill="#FFD700" transform="rotate(30 850 280)" />
  <!-- Front left leg -->
  <rect x="740" y="580" width="20" height="170" fill="#FFD700" transform="rotate(-15 750 665)" />
  <!-- Front right leg -->
  <rect x="820" y="580" width="20" height="170" fill="#FFD700" transform="rotate(15 830 665)" />
  <!-- Hind left leg -->
  <rect x="660" y="620" width="20" height="130" fill="#FFD700" transform="rotate(-25 670 685)" />
  <!-- Hind right leg -->
  <rect x="900" y="620" width="20" height="130" fill="#FFD700" transform="rotate(25 910 685)" />
  <!-- Tail -->
  <rect x="860" y="480" width="80" height="20" rx="10" ry="10" fill="#FFD700" transform="rotate(-45 860 490)" />
</svg>