<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="#e6e6e6" />

  <!-- Red tennis ball -->
  <circle cx="180" cy="280" r="60" fill="#d32f2f" />

  <!-- Green garden hose with nozzle -->
  <path d="M420,280 C480,240 560,240 620,280 C680,320 740,320 800,280" stroke="#2e7d32" stroke-width="24" fill="none" stroke-linecap="round" />
  <rect x="780" y="260" width="80" height="40" rx="8" fill="#2e7d32" />

  <!-- Bicycle with wicker basket and wilted daisies -->
  <!-- Bicycle frame -->
  <circle cx="1020" cy="420" r="40" fill="#757575" />
  <circle cx="1320" cy="420" r="40" fill="#757575" />
  <path d="M1020,380 L1120,300 L1240,300 L1320,380" stroke="#424242" stroke-width="12" fill="none" />
  <circle cx="1180" cy="300" r="8" fill="#424242" />
  <!-- Wicker basket (simplified woven pattern via crisscross lines) -->
  <rect x="1140" y="240" width="120" height="80" rx="12" fill="none" stroke="#8D6E63" stroke-width="4" />
  <line x1="1150" y1="250" x2="1250" y2="310" stroke="#8D6E63" stroke-width="2" />
  <line x1="1150" y1="270" x2="1250" y2="330" stroke="#8D6E63" stroke-width="2" />
  <line x1="1150" y1="290" x2="1250" y2="350" stroke="#8D6E63" stroke-width="2" />
  <line x1="1170" y1="250" x2="1270" y2="310" stroke="#8D6E63" stroke-width="2" />
  <line x1="1190" y1="250" x2="1290" y2="310" stroke="#8D6E63" stroke-width="2" />
  <!-- Wilted daisies (5 downward-tilted white ovals with yellow centers) -->
  <ellipse cx="1180" cy="270" rx="12" ry="6" fill="white" transform="rotate(-20 1180 270)" />
  <ellipse cx="1200" cy="275" rx="12" ry="6" fill="white" transform="rotate(-25 1200 275)" />
  <ellipse cx="1220" cy="272" rx="12" ry="6" fill="white" transform="rotate(-15 1220 272)" />
  <ellipse cx="1205" cy="285" rx="12" ry="6" fill="white" transform="rotate(-30 1205 285)" />
  <ellipse cx="1190" cy="295" rx="12" ry="6" fill="white" transform="rotate(-22 1190 295)" />
  <circle cx="1180" cy="270" r="2" fill="#FFD740" />
  <circle cx="1200" cy="275" r="2" fill="#FFD740" />
  <circle cx="1220" cy="272" r="2" fill="#FFD740" />
  <circle cx="1205" cy="285" r="2" fill="#FFD740" />
  <circle cx="1190" cy="295" r="2" fill="#FFD740" />

  <!-- Ivy-covered pickup truck front hood -->
  <!-- Hood shape -->
  <polygon points="200,850 750,850 700,650 250,650" fill="#424242" />
  <!-- Ivy leaves (8 simple green ovals) -->
  <ellipse cx="300" cy="680" rx="14" ry="8" fill="#2e7d32" transform="rotate(15 300 680)" />
  <ellipse cx="360" cy="670" rx="14" ry="8" fill="#2e7d32" transform="rotate(-10 360 670)" />
  <ellipse cx="420" cy="665" rx="14" ry="8" fill="#2e7d32" transform="rotate(25 420 665)" />
  <ellipse cx="480" cy="675" rx="14" ry="8" fill="#2e7d32" transform="rotate(-20 480 675)" />
  <ellipse cx="540" cy="680" rx="14" ry="8" fill="#2e7d32" transform="rotate(5 540 680)" />
  <ellipse cx="600" cy="670" rx="14" ry="8" fill="#2e7d32" transform="rotate(-15 600 670)" />
  <ellipse cx="650" cy="665" rx="14" ry="8" fill="#2e7d32" transform="rotate(30 650 665)" />
  <ellipse cx="690" cy="675" rx="14" ry="8" fill="#2e7d32" transform="rotate(-25 690 675)" />

  <!-- Drone -->
  <!-- Arms -->
  <rect x="1010" y="660" width="180" height="12" fill="#757575" />
  <rect x="1090" y="580" width="12" height="180" fill="#757575" />
  <!-- Rotors -->
  <circle cx="1010" cy="666" r="16" fill="#9E9E9E" />
  <circle cx="1190" cy="666" r="16" fill="#9E9E9E" />
  <circle cx="1096" cy="580" r="16" fill="#9E9E9E" />
  <circle cx="1096" cy="740" r="16" fill="#9E9E9E" />
  <!-- Body -->
  <rect x="1070" y="650" width="40" height="40" fill="#1976d2" rx="4" />
</svg>