<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1600" height="780" y="0" fill="#e0f7fa" />
  <!-- Grassy ground -->
  <rect width="1600" height="120" y="780" fill="#c8e6c9" />
  <!-- Straw hat brim (large oval) -->
  <ellipse cx="800" cy="210" rx="100" ry="30" fill="#f5f0e6" />
  <!-- Straw hat crown -->
  <circle cx="800" cy="210" r="40" fill="#f5f0e6" />
  <!-- Head -->
  <circle cx="800" cy="360" r="40" fill="#ffd1dc" />
  <!-- Torso (sundress base) -->
  <rect x="740" y="300" width="120" height="350" rx="15" ry="15" fill="#ffd1dc" />
  <!-- Left arm -->
  <rect x="780" y="400" width="20" height="80" fill="#ffd1dc" />
  <!-- Right arm -->
  <rect x="800" y="400" width="20" height="80" fill="#ffd1dc" />
  <!-- Left leg -->
  <rect x="750" y="650" width="40" height="130" fill="#ffd1dc" />
  <!-- Right leg -->
  <rect x="790" y="650" width="40" height="130" fill="#ffd1dc" />
  <!-- Feet -->
  <ellipse cx="790" cy="790" rx="30" ry="10" fill="#f5f0e6" />
  <ellipse cx="810" cy="790" rx="30" ry="10" fill="#f5f0e6" />
  <!-- Floral motifs -->
  <circle cx="790" cy="430" r="10" fill="#4a90e2" />
  <circle cx="830" cy="440" r="10" fill="#ff6b6b" />
  <circle cx="800" cy="490" r="10" fill="#50c878" />
  <circle cx="820" cy="500" r="10" fill="#4a90e2" />
  <circle cx="795" cy="550" r="10" fill="#ff6b6b" />
  <circle cx="825" cy="560" r="10" fill="#50c878" />
</svg>