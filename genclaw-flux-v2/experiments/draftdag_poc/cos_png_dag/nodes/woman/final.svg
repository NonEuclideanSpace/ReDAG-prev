<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1600" height="780" y="0" fill="#BBDEFB" />
  <!-- Grass ground -->
  <rect width="1600" height="120" y="780" fill="#4CAF50" />
  <!-- Hat (light yellow circle) -->
  <circle cx="800" cy="150" r="60" fill="#FFEB3B" />
  <!-- Head (light yellow circle, slightly overlapped by hat) -->
  <circle cx="800" cy="170" r="50" fill="#FFEB3B" />
  <!-- Torso (pink rounded rectangle, tilted) -->
  <g transform="rotate(-10 800 350)">
    <rect x="750" y="220" width="100" height="260" rx="12" ry="12" fill="#E91E63" />
  </g>
  <!-- Skirt (inverted trapezoid in pink) -->
  <polygon points="720,480 880,480 840,680 760,680" fill="#E91E63" />
  <!-- Left arm -->
  <g transform="rotate(-15 705 350)">
    <rect x="680" y="280" width="50" height="140" fill="#E91E63" />
  </g>
  <!-- Right arm -->
  <g transform="rotate(15 845 350)">
    <rect x="820" y="280" width="50" height="140" fill="#E91E63" />
  </g>
  <!-- Left leg -->
  <rect x="760" y="480" width="30" height="180" fill="#E91E63" />
  <!-- Right leg -->
  <rect x="810" y="480" width="30" height="180" fill="#E91E63" />
  <!-- Left foot -->
  <rect x="750" y="660" width="40" height="20" fill="#E91E63" />
  <!-- Right foot -->
  <rect x="810" y="660" width="40" height="20" fill="#E91E63" />
  <!-- White flower motif on skirt -->
  <circle cx="780" cy="530" r="10" fill="#FFFFFF" />
  <!-- Green leaf motif on skirt -->
  <circle cx="820" cy="540" r="8" fill="#4CAF50" />
</svg>