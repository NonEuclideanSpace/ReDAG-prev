<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="#FAF9F6" />
  
  <!-- Garden hose (gray curved path) -->
  <path d="M 0 420 C 200 410, 450 400, 800 420" stroke="#555" stroke-width="10" fill="none" />
  
  <!-- Hose nozzle (metallic gray rectangle) -->
  <rect x="785" y="412" width="30" height="16" fill="#B0BEC5" rx="2" />
  
  <!-- Water arc (bold blue curve) -->
  <path d="M 800 420 C 925 320, 1175 300, 1300 400" stroke="#2196F3" stroke-width="12" fill="none" />
  
  <!-- Woman silhouette / simplified figure -->
  <!-- Head -->
  <circle cx="800" cy="300" r="48" fill="#F5F0ED" />
  <!-- Straw hat (wide oval) -->
  <ellipse cx="800" cy="275" rx="90" ry="28" fill="#D4B98C" />
  <!-- Torso (tapered trapezoid) -->
  <polygon points="770,348 830,348 815,520 785,520" fill="#FFD8B1" />
  <!-- Floral pattern on dress (small blue circles) -->
  <circle cx="790" cy="390" r="5" fill="#4A90E2" />
  <circle cx="810" cy="430" r="5" fill="#4A90E2" />
  <circle cx="795" cy="470" r="5" fill="#4A90E2" />
  <!-- Arms -->
  <!-- Left arm (bent, downward-left) -->
  <path d="M 800 348 C 750 400, 720 480, 730 550" stroke="#F5F0ED" stroke-width="24" fill="none" stroke-linecap="round" />
  <!-- Right arm (bent, holding nozzle) -->
  <path d="M 800 348 C 830 400, 840 415, 800 420" stroke="#F5F0ED" stroke-width="24" fill="none" stroke-linecap="round" />
  <!-- Legs (bent, knees slightly apart) -->
  <path d="M 785 520 L 760 720" stroke="#F5F0ED" stroke-width="28" fill="none" stroke-linecap="round" />
  <path d="M 815 520 L 840 720" stroke="#F5F0ED" stroke-width="28" fill="none" stroke-linecap="round" />
</svg>