<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="0" y="0" width="1600" height="540" fill="#E0F7FA" />
  <!-- Grass background -->
  <rect x="0" y="540" width="1600" height="360" fill="#A5D6A7" />
  <!-- Cat head (oval) -->
  <ellipse cx="800" cy="270" rx="80" ry="70" fill="#8B4513" />
  <!-- Cat torso (rounded rectangle) -->
  <rect x="640" y="300" width="320" height="420" rx="60" ry="60" fill="#8B4513" />
  <!-- Left front paw -->
  <ellipse cx="730" cy="600" rx="30" ry="20" fill="#8B4513" />
  <!-- Right front paw -->
  <ellipse cx="870" cy="600" rx="30" ry="20" fill="#8B4513" />
  <!-- Left hind paw -->
  <ellipse cx="750" cy="660" rx="20" ry="20" fill="#8B4513" />
  <!-- Right hind paw -->
  <ellipse cx="850" cy="660" rx="20" ry="20" fill="#8B4513" />
</svg>