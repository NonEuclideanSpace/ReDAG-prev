<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="0" y="0" width="1600" height="765" fill="#E0F7FA" />
  
  <!-- Grass strip -->
  <rect x="0" y="765" width="1600" height="135" fill="#4CAF50" />
  
  <!-- Golden Retriever (simplified running pose) -->
  <!-- Body (torso) -->
  <ellipse cx="800" cy="480" rx="280" ry="120" fill="#FFD700" />
  
  <!-- Head -->
  <circle cx="1120" cy="400" r="90" fill="#FFD700" />
  
  <!-- Floppy ears (two large curved shapes) -->
  <path d="M1080 320 Q1040 220 1100 200 Q1160 180 1180 260 Q1200 340 1140 360 Z" fill="#FFD700" />
  <path d="M1160 320 Q1200 220 1140 200 Q1080 180 1060 260 Q1040 340 1100 360 Z" fill="#FFD700" />
  
  <!-- Front legs (left & right, extended forward) -->
  <rect x="1040" y="520" width="24" height="180" rx="12" fill="#FFD700" />
  <rect x="1120" y="520" width="24" height="180" rx="12" fill="#FFD700" />
  
  <!-- Hind legs (left & right, extended backward) -->
  <rect x="640" y="520" width="24" height="180" rx="12" fill="#FFD700" />
  <rect x="720" y="520" width="24" height="180" rx="12" fill="#FFD700" />
</svg>