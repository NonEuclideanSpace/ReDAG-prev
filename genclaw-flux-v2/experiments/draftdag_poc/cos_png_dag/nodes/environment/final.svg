    <rect x="1070" y="117" width="60" height="6" fill="#000000" />
  </g>
  <!-- Center body -->
  <rect x="1094" y="114" width="12" height="12" fill="#000000" />
  
  <!-- Ancient oak (right) -->
  <!-- Trunk -->
  <rect x="1270" y="320" width="36" height="280" fill="#5d4037" />
  <!-- Canopy (7 overlapping green circles) -->
  <circle cx="1250" cy="260" r="90" fill="#4caf50" />
  <circle cx="1290" cy="240" r="100" fill="#43a047" />
  <circle cx="1330" cy="270" r="95" fill="#388e3c" />
