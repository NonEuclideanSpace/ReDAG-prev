  <circle cx="800" cy="300" r="30" fill="#eeeeee" />
  <!-- Roof (triangle) -->
  <polygon points="780,220 820,220 800,190" fill="#5d4037" />
  
  <!-- Drone (upper sky) -->
  <!-- Left arm (rotated 45°) -->
  <g transform="rotate(45 1100 120)">
    <rect x="1070" y="117" width="60" height="6" fill="#000000" />
  </g>
  <!-- Right arm (rotated -45°) -->
