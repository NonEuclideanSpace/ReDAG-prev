<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FEFEFE" />
  <!-- Golden Retriever Silhouette -->
  <!-- Body -->
  <rect x="350" y="420" width="500" height="120" rx="60" ry="60" fill="#FFD700" />
  <!-- Head -->
  <ellipse cx="880" cy="450" rx="80" ry="60" fill="#FFD700" />
  <!-- Front right leg -->
  <rect x="520" y="540" width="20" height="140" transform="rotate(-25 530 610)" fill="#FFD700" />
  <!-- Front left leg -->
  <rect x="580" y="540" width="20" height="140" transform="rotate(-15 590 610)" fill="#FFD700" />
  <!-- Hind right leg -->
  <rect x="720" y="540" width="20" height="140" transform="rotate(15 730 610)" fill="#FFD700" />
  <!-- Hind left leg -->
  <rect x="780" y="540" width="20" height="140" transform="rotate(25 790 610)" fill="#FFD700" />
  <!-- Red tennis ball -->
  <circle cx="1300" cy="450" r="30" fill="#FF0000" />
</svg>