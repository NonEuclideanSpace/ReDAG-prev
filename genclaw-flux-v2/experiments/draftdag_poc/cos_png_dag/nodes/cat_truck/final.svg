<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="#fdfdfd" />

  <!-- Truck body (simplified pickup: cab + bed + wheel wells) -->
  <!-- Cab -->
  <rect x="600" y="400" width="200" height="180" fill="#4a4a4a" rx="12" />
  <!-- Bed -->
  <rect x="800" y="430" width="300" height="120" fill="#4a4a4a" rx="8" />
  <!-- Wheel wells (front & rear) -->
  <ellipse cx="640" cy="580" rx="40" ry="30" fill="#4a4a4a" />
  <ellipse cx="1060" cy="580" rx="40" ry="30" fill="#4a4a4a" />
  <!-- Hood (front, sloped upward, clearly visible) -->
  <polygon points="560,560 1040,560 1000,340 600,340" fill="#4a4a4a" />
  
  <!-- Ivy coverage (over hood and upper truck body) -->
  <!-- Green ivy clusters as overlapping ovals -->
  <ellipse cx="620" cy="420" rx="45" ry="30" fill="#2e7d32" />
  <ellipse cx="700" cy="390" rx="50" ry="35" fill="#388e3c" />
  <ellipse cx="780" cy="370" rx="42" ry="28" fill="#4caf50" />
  <ellipse cx="860" cy="380" rx="48" ry="32" fill="#2e7d32" />
  <ellipse cx="940" cy="410" rx="40" ry="26" fill="#388e3c" />
  <ellipse cx="1000" cy="440" rx="44" ry="30" fill="#4caf50" />
  <ellipse cx="680" cy="480" rx="38" ry="24" fill="#2e7d32" />
  <ellipse cx="820" cy="490" rx="40" ry="26" fill="#388e3c" />
  <ellipse cx="960" cy="470" rx="36" ry="22" fill="#4caf50" />

  <!-- Cat — centered directly on hood (top surface), upright, all four paws touching hood -->
  <!-- Body -->
  <ellipse cx="800" cy="390" rx="80" ry="60" fill="#5d4037" />
  <!-- Head -->
  <circle cx="800" cy="320" r="40" fill="#5d4037" />
  <!-- Ears -->
  <polygon points="770,290 760,260 780,275" fill="#5d4037" />
  <polygon points="830,290 840,260 820,275" fill="#5d4037" />
  <!-- Face details (minimal, non-textual) -->
  <circle cx="790" cy="315" r="5" fill="#f5f5f5" />
  <circle cx="810" cy="315" r="5" fill="#f5f5f5" />
  <!-- Belly (white oval) -->
  <ellipse cx="800" cy="370" rx="50" ry="30" fill="#f5f5f5" />
</svg>