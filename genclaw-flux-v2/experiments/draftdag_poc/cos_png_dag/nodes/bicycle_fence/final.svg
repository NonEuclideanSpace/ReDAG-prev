<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="#f8f8f8" />

  <!-- Rusted fence segment: 3 vertical posts + 2 horizontal rails -->
  <!-- Posts -->
  <rect x="1020" y="420" width="12" height="280" fill="#cc6633" />
  <rect x="1070" y="420" width="12" height="280" fill="#cc6633" />
  <rect x="1120" y="420" width="12" height="280" fill="#cc6633" />
  <!-- Rails -->
  <rect x="1020" y="480" width="112" height="10" fill="#cc6633" />
  <rect x="1020" y="550" width="112" height="10" fill="#cc6633" />

  <!-- Bicycle frame (simplified leaning polygon) -->
  <polygon points="840,620 860,620 1010,430 1030,430 1030,450 1010,450 860,640 840,640" fill="#333333" />
  <!-- Front wheel -->
  <circle cx="920" cy="620" r="42" fill="#000000" />
  <circle cx="920" cy="620" r="12" fill="#333333" />
  <!-- Rear wheel (touching fence post at x=1026, y=560) -->
  <circle cx="1026" cy="560" r="42" fill="#000000" />
  <circle cx="1026" cy="560" r="12" fill="#333333" />
  <!-- Handlebars -->
  <path d="M890 520 Q920 490 950 520" stroke="#333333" stroke-width="8" fill="none" />
  <!-- Seat post & seat -->
  <rect x="945" y="480" width="6" height="40" fill="#333333" />
  <ellipse cx="948" cy="475" rx="22" ry="8" fill="#333333" />

  <!-- Wicker basket (tan rounded rectangle with arched top) -->
  <rect x="880" y="420" width="120" height="90" rx="12" ry="12" fill="#d9c5b0" />
  <!-- Arched top overlay -->
  <path d="M880 420 Q940 390 1000 420" stroke="#d9c5b0" stroke-width="20" fill="none" stroke-linecap="round" />

  <!-- Wilted daisies: 6 white petals (circles) + 2 yellow centers -->
  <!-- Petals -->
  <circle cx="910" cy="450" r="6" fill="#ffffff" />
  <circle cx="940" cy="445" r="6" fill="#ffffff" />
  <circle cx="970" cy="455" r="6" fill="#ffffff" />
  <circle cx="925" cy="475" r="6" fill="#ffffff" />
  <circle cx="955" cy="480" r="6" fill="#ffffff" />
  <circle cx="985" cy="470" r="6" fill="#ffffff" />
  <!-- Yellow centers -->
  <circle cx="928" cy="453" r="3" fill="#ffd700" />
  <circle cx="958" cy="478" r="3" fill="#ffd700" />
</svg>