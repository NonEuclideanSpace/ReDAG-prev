  <!-- Dirt hole (rounded rectangle) -->
  <rect x="1100" y="750" width="240" height="140" rx="40" ry="40" fill="#8d6e63" />
  
  <!-- Terrier body -->
  <ellipse cx="1190" cy="725" rx="70" ry="45" fill="#d7ccc8" />
  
  <!-- Terrier head -->
  <circle cx="1170" cy="670" r="30" fill="#d7ccc8" />
  
  <!-- Terrier front left paw (contacting top edge of dirt hole) -->
  <circle cx="1130" cy="770" r="20" fill="#3e2723" />
  
