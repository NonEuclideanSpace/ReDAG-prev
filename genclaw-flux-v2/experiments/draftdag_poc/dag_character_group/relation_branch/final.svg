<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#f0f0f0"/>
  
  <!-- Woman (purple bent figure) -->
  <polygon points="180,280 180,440 220,440 220,360 260,360 260,400 300,400 300,280" fill="#8B4513"/>
  
  <!-- Hose water arc (blue curved stroke) -->
  <path d="M240,380 C300,340 400,360 480,400" stroke="#4169E1" stroke-width="8" fill="none"/>
  
  <!-- Bicycle (black wireframe) -->
  <g stroke="black" stroke-width="6" fill="none">
    <circle cx="420" cy="560" r="32"/>
    <circle cx="500" cy="560" r="32"/>
    <line x1="420" y1="560" x2="500" y2="560"/>
    <line x1="420" y1="560" x2="400" y2="480"/>
    <line x1="500" y1="560" x2="520" y2="480"/>
    <line x1="400" y1="480" x2="460" y2="420"/>
    <line x1="520" y1="480" x2="460" y2="420"/>
  </g>
  
  <!-- Fence segment (brown) -->
  <g fill="#8B4513">
    <rect x="495" y="540" width="5" height="60"/>
    <rect x="505" y="540" width="5" height="60"/>
    <rect x="515" y="540" width="5" height="60"/>
    <rect x="495" y="530" width="25" height="10"/>
  </g>
  
  <!-- Terrier (brown digging) -->
  <ellipse cx="1080" cy="640" rx="60" ry="40" fill="#8B4513"/>
  <line x1="1040" y1="640" x2="1040" y2="680" stroke="#2F4F4F" stroke-width="6"/>
  <line x1="1060" y1="640" x2="1060" y2="680" stroke="#2F4F4F" stroke-width="6"/>
  <line x1="1100" y1="640" x2="1100" y2="680" stroke="#2F4F4F" stroke-width="6"/>
  <line x1="1120" y1="640" x2="1120" y2="680" stroke="#2F4F4F" stroke-width="6"/>
  
  <!-- Oak trunk base (brown rectangle + grooves) -->
  <rect x="1020" y="560" width="120" height="40" fill="#8B4513"/>
  <line x1="1050" y1="560" x2="1050" y2="600" stroke="#2F4F4F" stroke-width="3"/>
  <line x1="1080" y1="560" x2="1080" y2="600" stroke="#2F4F4F" stroke-width="3"/>
  <line x1="1110" y1="560" x2="1110" y2="600" stroke="#2F4F4F" stroke-width="3"/>
  
  <!-- Cat (orange) -->
  <ellipse cx="1250" cy="290" rx="50" ry="40" fill="#FF8C00"/>
  <polygon points="1220,250 1230,230 1240,250" fill="#FF8C00"/>
  <polygon points="1260,250 1270,230 1280,250" fill="#FF8C00"/>
  
  <!-- Pickup truck hood (gray trapezoid) -->
  <polygon points="1200,260 1360,260 1340,220 1180,220" fill="#808080"/>
  
  <!-- Oak branch (thin brown line) -->
  <line x1="700" y1="320" x2="880" y2="320" stroke="#8B4513" stroke-width="8"/>
  
  <!-- Ladybug chain (9 alternating red/black circles along curve) -->
  <!-- Approximate positions along smooth curve from (700,320) to (1100,580) -->
  <circle cx="730" cy="340" r="6" fill="#DC143C"/>
  <circle cx="770" cy="365" r="6" fill="#000000"/>
  <circle cx="810" cy="395" r="6" fill="#DC143C"/>
  <circle cx="850" cy="425" r="6" fill="#000000"/>
  <circle cx="890" cy="455" r="6" fill="#DC143C"/>
  <circle cx="930" cy="485" r="6" fill="#000000"/>
  <circle cx="970" cy="515" r="6" fill="#DC143C"/>
  <circle cx="1010" cy="540" r="6" fill="#000000"/>
  <circle cx="1050" cy="565" r="6" fill="#DC143C"/>
  
  <!-- Tennis ball (red with white highlight) -->
  <circle cx="1110" cy="590" r="30" fill="#DC143C"/>
  <circle cx="1100" cy="580" r="8" fill="#FFFFFF"/>
  
  <!-- Drone (black X with center dot) -->
  <g stroke="black" stroke-width="4" fill="none">
    <line x1="795" y1="110" x2="815" y2="130"/>
    <line x1="795" y1="130" x2="815" y2="110"/>
    <line x1="795" y1="120" x2="815" y2="120"/>
    <line x1="805" y1="110" x2="805" y2="130"/>
  </g>
  <circle cx="805" cy="120" r="3" fill="black"/>
</svg>