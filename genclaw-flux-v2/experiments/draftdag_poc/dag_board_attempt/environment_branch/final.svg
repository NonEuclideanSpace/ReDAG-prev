<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect x="0" y="0" width="1600" height="495" fill="#c2e0ff" />
  
  <!-- Clouds -->
  <ellipse cx="260" cy="120" rx="60" ry="20" fill="#ffffff" />
  <ellipse cx="570" cy="80" rx="70" ry="20" fill="#ffffff" />
  <ellipse cx="970" cy="140" rx="70" ry="20" fill="#ffffff" />
  <ellipse cx="1270" cy="60" rx="70" ry="20" fill="#ffffff" />
  
  <!-- Grassy ground -->
  <rect x="0" y="495" width="1600" height="405" fill="#a8d88e" />
  
  <!-- Sun dapples on grass -->
  <circle cx="415" cy="535" r="15" fill="#f0f5f0" />
  <circle cx="715" cy="555" r="15" fill="#f0f5f0" />
  <circle cx="1115" cy="545" r="15" fill="#f0f5f0" />
  
  <!-- Rusted fence posts -->
  <rect x="120" y="320" width="40" height="180" fill="#7a2e2e" />
  <rect x="180" y="320" width="40" height="180" fill="#7a2e2e" />
  <rect x="240" y="320" width="40" height="180" fill="#7a2e2e" />
  <rect x="300" y="320" width="40" height="180" fill="#7a2e2e" />
  <rect x="360" y="320" width="40" height="180" fill="#7a2e2e" />
  
  <!-- Rusted fence rails -->
  <rect x="120" y="360" width="400" height="12" fill="#7a2e2e" />
  <rect x="120" y="400" width="400" height="12" fill="#7a2e2e" />
  <rect x="120" y="440" width="400" height="12" fill="#7a2e2e" />
  
  <!-- Oak trunk -->
  <rect x="1200" y="300" width="60" height="480" fill="#3a2a1a" />
  
  <!-- Oak low branch -->
  <rect x="980" y="410" width="260" height="20" fill="#4a3525" />
  
  <!-- Oak canopy circles -->
  <circle cx="1150" cy="240" r="60" fill="#2d5a27" />
  <circle cx="1190" cy="280" r="60" fill="#2d5a27" />
  <circle cx="1220" cy="320" r="60" fill="#2d5a27" />
  <circle cx="1170" cy="360" r="60" fill="#2d5a27" />
  <circle cx="1210" cy="400" r="60" fill="#2d5a27" />
  <circle cx="1120" cy="440" r="60" fill="#2d5a27" />
  <circle cx="1290" cy="480" r="60" fill="#2d5a27" />
  
  <!-- Clock tower base -->
  <rect x="780" y="380" width="40" height="90" fill="#8a7f7f" />
  
  <!-- Clock face -->
  <rect x="795" y="410" width="10" height="10" fill="#e0e0e0" />
  <circle cx="800" cy="415" r="5" fill="none" stroke="#000000" stroke-width="1" />
  
  <!-- Clock hand (12 o'clock) -->
  <line x1="800" y1="415" x2="800" y2="403" stroke="#000000" stroke-width="2" />
</svg>