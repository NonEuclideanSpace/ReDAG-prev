<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#f8f8f8"/>
  
  <!-- Red tennis ball -->
  <circle cx="200" cy="450" r="90" fill="#e53935"/>
  
  <!-- Green garden hose with gray nozzle -->
  <path d="M 420 450 Q 460 420 500 450 T 540 450" stroke="#43a047" stroke-width="24" fill="none" stroke-linecap="round"/>
  <rect x="540" y="442.5" width="30" height="15" fill="#5d4037" rx="3"/>
  
  <!-- Bicycle with wicker basket and wilted daisies -->
  <!-- Frame -->
  <path d="M 700 470 L 740 410 L 820 410 L 860 470 L 820 530 L 740 530 Z" fill="#37474f" stroke="#263238" stroke-width="4"/>
  <!-- Wheels -->
  <circle cx="720" cy="530" r="32" fill="#263238"/>
  <circle cx="840" cy="530" r="32" fill="#263238"/>
  <circle cx="720" cy="530" r="12" fill="#ffffff"/>
  <circle cx="840" cy="530" r="12" fill="#ffffff"/>
  <!-- Wicker basket (rounded rect) -->
  <rect x="755" y="390" width="60" height="40" rx="8" ry="8" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
  <!-- Wilted daisies: 4 white flower heads with green stems -->
  <circle cx="765" cy="385" r="6" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <line x1="765" y1="391" x2="765" y2="400" stroke="#43a047" stroke-width="2"/>
  <circle cx="775" cy="380" r="6" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <line x1="775" y1="386" x2="775" y2="400" stroke="#43a047" stroke-width="2"/>
  <circle cx="785" cy="385" r="6" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <line x1="785" y1="391" x2="785" y2="400" stroke="#43a047" stroke-width="2"/>
  <circle cx="795" cy="380" r="6" fill="#ffffff" stroke="#43a047" stroke-width="1.5"/>
  <line x1="795" y1="386" x2="795" y2="400" stroke="#43a047" stroke-width="2"/>
  
  <!-- Ivy-covered pickup truck (front hood) -->
  <!-- Hood (trapezoid) -->
  <polygon points="980,400 1100,400 1080,480 1000,480" fill="#90a4ae" stroke="#546e7a" stroke-width="3"/>
  <!-- Grille -->
  <rect x="1020" y="430" width="40" height="12" fill="#37474f"/>
  <!-- Headlights -->
  <ellipse cx="1010" cy="465" rx="8" ry="5" fill="#fff9c4"/>
  <ellipse cx="1070" cy="465" rx="8" ry="5" fill="#fff9c4"/>
  <!-- Ivy leaves (4 small dark-green polygons) -->
  <polygon points="1020,420 1024,412 1030,418" fill="#388e3c"/>
  <polygon points="1050,415 1055,407 1061,413" fill="#388e3c"/>
  <polygon points="1040,445 1045,437 1051,443" fill="#388e3c"/>
  <polygon points="1075,440 1080,432 1086,438" fill="#388e3c"/>
  
  <!-- Drone -->
  <!-- Body -->
  <rect x="1280" y="430" width="40" height="40" fill="#37474f" rx="4"/>
  <!-- Arms -->
  <line x1="1280" y1="450" x2="1240" y2="450" stroke="#37474f" stroke-width="4" stroke-linecap="round"/>
  <line x1="1320" y1="450" x2="1360" y2="450" stroke="#37474f" stroke-width="4" stroke-linecap="round"/>
  <line x1="1300" y1="430" x2="1300" y2="390" stroke="#37474f" stroke-width="4" stroke-linecap="round"/>
  <line x1="1300" y1="470" x2="1300" y2="510" stroke="#37474f" stroke-width="4" stroke-linecap="round"/>
  <!-- Rotors -->
  <circle cx="1240" cy="450" r="8" fill="#ffffff"/>
  <circle cx="1360" cy="450" r="8" fill="#ffffff"/>
  <circle cx="1300" cy="390" r="8" fill="#ffffff"/>
  <circle cx="1300" cy="510" r="8" fill="#ffffff"/>
</svg>