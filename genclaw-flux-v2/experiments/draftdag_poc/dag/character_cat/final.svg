<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1600" height="750" y="0" fill="#BBDEFB" />
  <!-- Grass foreground -->
  <rect width="1600" height="150" y="750" fill="#8BC34A" />
  <!-- Cat body (oval) -->
  <ellipse cx="800" cy="540" rx="200" ry="160" fill="#F0D9C0" />
  <!-- Cat head (oval) -->
  <ellipse cx="800" cy="330" rx="120" ry="90" fill="#F0D9C0" />
  <!-- Left ear (triangle) -->
  <polygon points="720,220 700,200 740,200" fill="#F0D9C0" />
  <!-- Right ear (triangle) -->
  <polygon points="880,220 860,200 900,200" fill="#F0D9C0" />
  <!-- Left front paw (rounded rectangle) -->
  <rect x="720" y="680" width="40" height="40" rx="8" ry="8" fill="#F0D9C0" />
  <!-- Right front paw (rounded rectangle) -->
  <rect x="840" y="680" width="40" height="40" rx="8" ry="8" fill="#F0D9C0" />
  <!-- Tail (curved upward segment) -->
  <path d="M 840 540 Q 880 500 900 520" stroke="#F0D9C0" stroke-width="24" fill="none" stroke-linecap="round" />
</svg>