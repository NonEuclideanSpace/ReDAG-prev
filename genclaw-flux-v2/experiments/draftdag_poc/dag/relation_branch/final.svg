<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="white"/>

  <!-- LEFT GROUP -->
  <!-- Woman: torso (gray), head (gray), arm arc (blue), nozzle (red) -->
  <ellipse cx="300" cy="540" rx="30" ry="120" fill="#95a5a6"/>
  <circle cx="300" cy="400" r="22" fill="#95a5a6"/>
  <path d="M 300 422 Q 380 420 380 420" stroke="#3498db" stroke-width="8" fill="none"/>
  <circle cx="380" cy="420" r="10" fill="#e74c3c"/>

  <!-- Water arc (blue curved path) -->
  <path d="M 380 420 Q 450 500 520 600" stroke="#3498db" stroke-width="12" fill="none"/>

  <!-- Bicycle: wheels + frame -->
  <circle cx="500" cy="720" r="32" fill="#2c3e50"/>
  <circle cx="620" cy="720" r="32" fill="#2c3e50"/>
  <line x1="500" y1="720" x2="620" y2="720" stroke="#34495e" stroke-width="16"/>
  <line x1="500" y1="680" x2="600" y2="620" stroke="#34495e" stroke-width="12"/>
  <line x1="620" y1="680" x2="620" y2="620" stroke="#34495e" stroke-width="12"/>

  <!-- Fence segment (3 short brown posts) -->
  <rect x="590" y="500" width="10" height="150" fill="#8b4513"/>
  <rect x="605" y="500" width="10" height="150" fill="#8b4513"/>
  <rect x="620" y="500" width="10" height="150" fill="#8b4513"/>

  <!-- RIGHT GROUP -->
  <!-- Oak trunk -->
  <rect x="1030" y="280" width="60" height="490" fill="#8b4513"/>

  <!-- Terrier digging at base -->
  <ellipse cx="1060" cy="740" rx="30" ry="20" fill="#d35400"/>
  <path d="M 1040 740 Q 1060 710 1080 740" stroke="#d35400" stroke-width="14" fill="none"/>

  <!-- Pickup truck hood -->
  <rect x="1090" y="600" width="160" height="80" rx="12" ry="12" fill="#3498db"/>

  <!-- Cat on hood -->
  <ellipse cx="1155" cy="645" rx="15" ry="10" fill="#95a5a6"/>

  <!-- Low oak branch endpoint (start of ladybug chain) -->
  <rect x="990" y="270" width="20" height="20" fill="#8b4513"/>

  <!-- Tennis ball -->
  <circle cx="1380" cy="660" r="28" fill="#e74c3c"/>

  <!-- Ladybug chain: 12 red circles with black dots -->
  <!-- Coordinates pre-calculated along smooth descending curve from (1000,280) to (1380,660) -->
  <circle cx="1006" cy="286" r="6" fill="#e74c3c"/>
  <circle cx="1038" cy="316" r="6" fill="#e74c3c"/>
  <circle cx="1070" cy="346" r="6" fill="#e74c3c"/>
  <circle cx="1102" cy="376" r="6" fill="#e74c3c"/>
  <circle cx="1134" cy="406" r="6" fill="#e74c3c"/>
  <circle cx="1166" cy="436" r="6" fill="#e74c3c"/>
  <circle cx="1198" cy="466" r="6" fill="#e74c3c"/>
  <circle cx="1230" cy="496" r="6" fill="#e74c3c"/>
  <circle cx="1262" cy="526" r="6" fill="#e74c3c"/>
  <circle cx="1294" cy="556" r="6" fill="#e74c3c"/>
  <circle cx="1326" cy="586" r="6" fill="#e74c3c"/>
  <circle cx="1358" cy="616" r="6" fill="#e74c3c"/>

  <!-- Black dots inside ladybugs -->
  <circle cx="1006" cy="286" r="2" fill="black"/>
  <circle cx="1038" cy="316" r="2" fill="black"/>
  <circle cx="1070" cy="346" r="2" fill="black"/>
  <circle cx="1102" cy="376" r="2" fill="black"/>
  <circle cx="1134" cy="406" r="2" fill="black"/>
  <circle cx="1166" cy="436" r="2" fill="black"/>
  <circle cx="1198" cy="466" r="2" fill="black"/>
  <circle cx="1230" cy="496" r="2" fill="black"/>
  <circle cx="1262" cy="526" r="2" fill="black"/>
  <circle cx="1294" cy="556" r="2" fill="black"/>
  <circle cx="1326" cy="586" r="2" fill="black"/>
  <circle cx="1358" cy="616" r="2" fill="black"/>

  <!-- Drone (cross shape) -->
  <rect x="795" y="175" width="10" height="20" fill="#7f8c8d"/>
  <rect x="790" y="180" width="20" height="10" fill="#7f8c8d"/>
</svg>