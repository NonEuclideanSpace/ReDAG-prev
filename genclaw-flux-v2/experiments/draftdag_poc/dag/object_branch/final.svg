<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#f8f8f8"/>
  
  <!-- Red tennis ball -->
  <circle cx="320" cy="225" r="60" fill="#e53935"/>
  
  <!-- Green garden hose with nozzle -->
  <path d="M 650 225 
           C 720 205, 800 205, 880 225 
           C 920 235, 960 255, 980 225" 
        stroke="#43a047" stroke-width="24" fill="none" stroke-linecap="round"/>
  <ellipse cx="992" cy="225" rx="12" ry="20" fill="#43a047"/>
  
  <!-- Bicycle with wicker basket and wilted daisies -->
  <!-- Frame & wheels -->
  <circle cx="1160" cy="275" r="36" fill="none" stroke="#37474f" stroke-width="8"/>
  <circle cx="1360" cy="275" r="36" fill="none" stroke="#37474f" stroke-width="8"/>
  <line x1="1160" y1="275" x2="1360" y2="275" stroke="#37474f" stroke-width="8"/>
  <line x1="1260" y1="160" x2="1260" y2="275" stroke="#37474f" stroke-width="8"/>
  <line x1="1260" y1="160" x2="1320" y2="120" stroke="#37474f" stroke-width="8"/>
  <!-- Wicker basket (simplified rounded rectangle) -->
  <rect x="1290" y="125" width="80" height="50" rx="8" ry="8" fill="none" stroke="#8d6e63" stroke-width="4" stroke-dasharray="6,4"/>
  <!-- Wilted daisies (4 small stems with drooping petals) -->
  <g fill="#5d4037">
    <line x1="1305" y1="150" x2="1305" y2="175" stroke-width="2"/>
    <line x1="1325" y1="150" x2="1325" y2="175" stroke-width="2"/>
    <line x1="1345" y1="150" x2="1345" y2="175" stroke-width="2"/>
    <line x1="1365" y1="150" x2="1365" y2="175" stroke-width="2"/>
  </g>
  <g fill="#d4b73b">
    <ellipse cx="1305" cy="145" rx="8" ry="4" transform="rotate(-20 1305 145)"/>
    <ellipse cx="1325" cy="145" rx="8" ry="4" transform="rotate(15 1325 145)"/>
    <ellipse cx="1345" cy="145" rx="8" ry="4" transform="rotate(-10 1345 145)"/>
    <ellipse cx="1365" cy="145" rx="8" ry="4" transform="rotate(25 1365 145)"/>
  </g>
  
  <!-- Ivy-covered pickup truck (front hood only) -->
  <!-- Hood base -->
  <polygon points="290,625 510,625 490,725 270,725" fill="#37474f"/>
  <!-- Grille -->
  <rect x="350" y="645" width="150" height="20" fill="#263238"/>
  <!-- Headlights -->
  <ellipse cx="310" cy="675" rx="12" ry="8" fill="#ffcc00"/>
  <ellipse cx="490" cy="675" rx="12" ry="8" fill="#ffcc00"/>
  <!-- Ivy blobs (green irregular ovals) -->
  <ellipse cx="260" cy="615" rx="24" ry="10" fill="#2e7d32" opacity="0.8"/>
  <ellipse cx="300" cy="595" rx="18" ry="8" fill="#2e7d32" opacity="0.8"/>
  <ellipse cx="420" cy="585" rx="26" ry="12" fill="#2e7d32" opacity="0.8"/>
  <ellipse cx="520" cy="605" rx="20" ry="9" fill="#2e7d32" opacity="0.8"/>
  <ellipse cx="470" cy="735" rx="22" ry="10" fill="#2e7d32" opacity="0.8"/>
  
  <!-- Drone (quadcopter) -->
  <!-- Body -->
  <rect x="1150" y="625" width="100" height="100" rx="12" ry="12" fill="#546e7a"/>
  <!-- Arms -->
  <rect x="1090" y="665" width="60" height="20" rx="4" ry="4" fill="#546e7a"/>
  <rect x="1250" y="665" width="60" height="20" rx="4" ry="4" fill="#546e7a"/>
  <rect x="1190" y="605" width="20" height="60" rx="4" ry="4" fill="#546e7a"/>
  <rect x="1190" y="705" width="20" height="60" rx="4" ry="4" fill="#546e7a"/>
  <!-- Rotors -->
  <circle cx="1090" cy="675" r="12" fill="#78909c"/>
  <circle cx="1310" cy="675" r="12" fill="#78909c"/>
  <circle cx="1200" cy="605" r="12" fill="#78909c"/>
  <circle cx="1200" cy="765" r="12" fill="#78909c"/>
</svg>