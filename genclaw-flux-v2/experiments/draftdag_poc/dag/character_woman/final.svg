<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1600" height="780" y="0" fill="#E6F7FF" />
  
  <!-- Grassy ground -->
  <rect width="1600" height="120" y="780" fill="#C8E6C9" />
  
  <!-- Straw hat brim (ellipse) -->
  <ellipse cx="800" cy="240" rx="80" ry="20" fill="#F8F3D4" />
  
  <!-- Straw hat crown (circle) -->
  <circle cx="800" cy="190" r="30" fill="#F8F3D4" />
  
  <!-- Head -->
  <circle cx="800" cy="220" r="100" fill="#FFE0B2" />
  
  <!-- Torso (slightly tilted rounded rectangle) -->
  <g transform="rotate(-15 800 470)">
    <rect x="760" y="320" width="80" height="300" rx="12" ry="12" fill="#FADADD" />
  </g>
  
  <!-- Left arm -->
  <rect x="790" y="340" width="20" height="240" rx="5" ry="5" fill="#FADADD" />
  
  <!-- Right arm -->
  <rect x="790" y="340" width="20" height="240" rx="5" ry="5" fill="#FADADD" transform="rotate(15 800 470)" />
  
  <!-- Left leg -->
  <rect x="740" y="580" width="40" height="300" rx="8" ry="8" fill="#FADADD" />
  
  <!-- Right leg -->
  <rect x="820" y="580" width="40" height="300" rx="8" ry="8" fill="#FADADD" />
  
  <!-- Sundress trapezoid (base shape) -->
  <polygon points="740,320 860,320 840,620 760,620" fill="#FADADD" />
  
  <!-- Floral pattern: 7 small flowers -->
  <!-- Red flowers -->
  <circle cx="770" cy="380" r="8" fill="#E53935" />
  <circle cx="810" cy="420" r="8" fill="#E53935" />
  <circle cx="790" cy="480" r="8" fill="#E53935" />
  <circle cx="830" cy="520" r="8" fill="#E53935" />
  <!-- Violet flowers -->
  <circle cx="760" cy="450" r="7" fill="#6A1B9A" />
  <circle cx="840" cy="400" r="7" fill="#6A1B9A" />
  <circle cx="800" cy="550" r="7" fill="#6A1B9A" />
</svg>