<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect x="0" y="0" width="1600" height="500" fill="#aaddff" />
  
  <!-- Clouds -->
  <ellipse cx="250" cy="130" rx="50" ry="35" fill="white" />
  <ellipse cx="560" cy="95" rx="60" ry="40" fill="white" />
  <ellipse cx="960" cy="155" rx="60" ry="35" fill="white" />
  <ellipse cx="1260" cy="115" rx="60" ry="40" fill="white" />
  
  <!-- Grass ground -->
  <rect x="0" y="500" width="1600" height="400" fill="#88cc66" />
  
  <!-- Rusted fence posts -->
  <rect x="100" y="450" width="12" height="180" fill="#8b4513" />
  <rect x="220" y="450" width="12" height="180" fill="#8b4513" />
  <rect x="340" y="450" width="12" height="180" fill="#8b4513" />
  <rect x="460" y="450" width="12" height="180" fill="#8b4513" />
  <rect x="580" y="450" width="12" height="180" fill="#8b4513" />
  <rect x="700" y="450" width="12" height="180" fill="#8b4513" />
  
  <!-- Fence rails -->
  <rect x="100" y="500" width="600" height="15" fill="#b83d25" />
  <rect x="100" y="560" width="600" height="15" fill="#b83d25" />
  
  <!-- Oak trunk -->
  <rect x="1200" y="300" width="60" height="200" fill="#8b4513" />
  
  <!-- Oak canopy (5 overlapping circles for structural mass) -->
  <circle cx="1230" cy="220" r="60" fill="#4caf50" />
  <circle cx="1200" cy="240" r="55" fill="#4caf50" />
  <circle cx="1260" cy="240" r="55" fill="#4caf50" />
  <circle cx="1230" cy="270" r="50" fill="#4caf50" />
  <circle cx="1215" cy="210" r="45" fill="#4caf50" />
  
  <!-- Low oak branch -->
  <rect x="900" y="380" width="350" height="15" fill="#8b4513" />
  
  <!-- Clock tower base -->
  <rect x="1020" y="220" width="40" height="40" fill="#999999" />
  
  <!-- Clock face -->
  <circle cx="1040" cy="240" r="8" fill="#000000" />
  
  <!-- Clock tower roof -->
  <polygon points="1040,210 1025,230 1055,230" fill="#000000" />
</svg>