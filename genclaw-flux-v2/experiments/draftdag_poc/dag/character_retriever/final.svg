<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1600" height="630" y="0" fill="#E0F7FA" />
  <!-- Grass background -->
  <rect width="1600" height="270" y="630" fill="#4CAF50" />
  <!-- Dog body (horizontal oval) -->
  <ellipse cx="800" cy="340" rx="200" ry="120" fill="#FFD700" />
  <!-- Dog head (circle) -->
  <circle cx="800" cy="240" r="80" fill="#FFD700" />
  <!-- Left floppy ear (rotated ellipse) -->
  <g transform="rotate(-20 710 170)">
    <ellipse cx="710" cy="170" rx="50" ry="50" fill="#FFD700" />
  </g>
  <!-- Right floppy ear (rotated ellipse) -->
  <g transform="rotate(20 890 170)">
    <ellipse cx="890" cy="170" rx="50" ry="50" fill="#FFD700" />
  </g>
  <!-- Left front leg -->
  <rect x="690" y="420" width="20" height="200" fill="#FFD700" />
  <!-- Right front leg -->
  <rect x="910" y="420" width="20" height="200" fill="#FFD700" />
  <!-- Left back leg -->
  <rect x="630" y="460" width="20" height="160" fill="#FFD700" />
  <!-- Right back leg -->
  <rect x="970" y="460" width="20" height="160" fill="#FFD700" />
  <!-- Tail -->
  <rect x="980" y="330" width="80" height="20" rx="10" ry="10" fill="#FFD700" />
</svg>