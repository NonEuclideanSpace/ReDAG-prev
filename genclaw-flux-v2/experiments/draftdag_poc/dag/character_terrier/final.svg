<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="1600" height="750" y="0" fill="#BBDEFB" />
  
  <!-- Grass band -->
  <rect width="1600" height="150" y="750" fill="#4CAF50" />
  <rect width="1600" height="60" y="810" fill="#388E3C" />
  
  <!-- Terrier body (torso) -->
  <ellipse cx="800" cy="650" rx="140" ry="90" fill="#F5F5F5" />
  
  <!-- Terrier head -->
  <circle cx="880" cy="520" r="50" fill="#F5F5F5" />
  
  <!-- Left ear -->
  <polygon points="860,480 845,440 875,455" fill="#F5F5F5" />
  
  <!-- Right ear -->
  <polygon points="900,480 915,440 885,455" fill="#F5F5F5" />
  
  <!-- Front left leg -->
  <ellipse cx="760" cy="720" rx="20" ry="70" fill="#F5F5F5" transform="rotate(-20 760 720)" />
  
  <!-- Front right leg -->
  <ellipse cx="840" cy="720" rx="20" ry="70" fill="#F5F5F5" transform="rotate(20 840 720)" />
  
  <!-- Hind left leg -->
  <ellipse cx="720" cy="760" rx="25" ry="70" fill="#F5F5F5" transform="rotate(-40 720 760)" />
  
  <!-- Hind right leg -->
  <ellipse cx="880" cy="760" rx="25" ry="70" fill="#F5F5F5" transform="rotate(40 880 760)" />
  
  <!-- Brown leather harness: chest strap -->
  <rect x="770" y="610" width="160" height="20" fill="#5D4037" rx="10" />
  
  <!-- Harness: back strap -->
  <rect x="770" y="670" width="160" height="12" fill="#5D4037" rx="6" />
  
  <!-- Harness: connecting side straps (left) -->
  <rect x="760" y="610" width="12" height="60" fill="#5D4037" rx="6" />
  
  <!-- Harness: connecting side straps (right) -->
  <rect x="918" y="610" width="12" height="60" fill="#5D4037" rx="6" />
</svg>