<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1600" height="675" y="0" fill="#E0F7FA" />
  <!-- Grass background -->
  <rect width="1600" height="225" y="675" fill="#90EE90" />
  <!-- Dog body -->
  <rect x="500" y="300" width="600" height="450" rx="120" ry="120" fill="#FFD700" />
  <!-- Dog head -->
  <ellipse cx="800" cy="310" rx="150" ry="110" fill="#FFD700" />
  <!-- Left floppy ear -->
  <ellipse cx="630" cy="400" rx="50" ry="180" fill="#D4AF37" transform="rotate(-20 630 400)" />
  <!-- Right floppy ear -->
  <ellipse cx="870" cy="400" rx="50" ry="180" fill="#D4AF37" transform="rotate(20 870 400)" />
  <!-- Front-left leg -->
  <rect x="680" y="520" width="40" height="200" rx="8" ry="8" fill="#FFD700" />
  <!-- Front-right leg -->
  <rect x="780" y="520" width="40" height="200" rx="8" ry="8" fill="#FFD700" />
  <!-- Rear-left leg -->
  <rect x="880" y="520" width="40" height="200" rx="8" ry="8" fill="#FFD700" />
  <!-- Rear-right leg -->
  <rect x="980" y="520" width="40" height="200" rx="8" ry="8" fill="#FFD700" />
  <!-- Tail -->
  <rect x="920" y="400" width="120" height="30" rx="15" ry="15" fill="#FFD700" transform="rotate(-35 920 415)" />
</svg>