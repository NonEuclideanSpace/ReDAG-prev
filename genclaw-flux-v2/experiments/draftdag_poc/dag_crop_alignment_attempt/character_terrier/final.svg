  <rect x="630" y="750" width="58" height="29" rx="29" ry="14.5" fill="#43A047" />
  <rect x="770" y="745" width="52" height="26" rx="26" ry="13" fill="#43A047" />
  <rect x="910" y="755" width="60" height="30" rx="30" ry="15" fill="#43A047" />
  <rect x="1050" y="740" width="55" height="28" rx="27.5" ry="14" fill="#43A047" />
