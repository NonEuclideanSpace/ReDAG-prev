<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="1600" height="750" y="0" fill="#ADD8E6" />
  <!-- Grass -->
  <rect width="1600" height="150" y="750" fill="#4CAF50" />
  <!-- Cat body (torso) -->
  <ellipse cx="800" cy="540" rx="200" ry="120" fill="#FF9E58" />
  <!-- Cat head -->
  <circle cx="800" cy="380" r="80" fill="#FF9E58" />
  <!-- Left ear -->
  <rect x="680" y="330" width="40" height="40" fill="#FF9E58" rx="5" />
  <!-- Right ear -->
  <rect x="880" y="330" width="40" height="40" fill="#FF9E58" rx="5" />
  <!-- Left front paw -->
  <rect x="720" y="420" width="60" height="60" fill="#FF9E58" rx="12" />
  <!-- Right front paw -->
  <rect x="820" y="420" width="60" height="60" fill="#FF9E58" rx="12" />
  <!-- Left hind paw -->
  <rect x="740" y="620" width="40" height="60" fill="#FF9E58" rx="8" />
  <!-- Right hind paw -->
  <rect x="820" y="620" width="40" height="60" fill="#FF9E58" rx="8" />
</svg>