<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="1600" height="900" fill="#BBDEFB" />
  
  <!-- Grassy ground -->
  <rect y="780" width="1600" height="120" fill="#4CAF50" />
  
  <!-- Hat brim -->
  <ellipse cx="800" cy="215" rx="120" ry="25" fill="#FFEB3B" />
  
  <!-- Hat crown -->
  <ellipse cx="800" cy="210" rx="20" ry="10" fill="#FFEB3B" />
  
  <!-- Head -->
  <circle cx="800" cy="170" r="50" fill="#FFEB3B" />
  
  <!-- Torso (sundress) -->
  <rect x="720" y="220" width="160" height="320" rx="12" ry="12" fill="#FF416C" />
  
  <!-- Left arm -->
  <rect x="700" y="260" width="20" height="200" fill="#81C784" />
  
  <!-- Right arm -->
  <rect x="860" y="260" width="20" height="200" fill="#81C784" />
  
  <!-- Left leg -->
  <rect x="730" y="540" width="20" height="240" fill="#2E7D32" />
  
  <!-- Right leg -->
  <rect x="850" y="540" width="20" height="240" fill="#2E7D32" />
  
  <!-- Floral accents (4 circles) -->
  <circle cx="770" cy="330" r="10" fill="#E91E63" />
  <circle cx="830" cy="320" r="10" fill="#009688" />
  <circle cx="800" cy="370" r="10" fill="#673AB7" />
  <circle cx="850" cy="350" r="10" fill="#E91E63" />
</svg>