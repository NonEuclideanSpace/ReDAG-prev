<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="0" y="0" width="1600" height="540" fill="#87CEEB" />
  
  <!-- Grassy ground -->
  <rect x="0" y="540" width="1600" height="360" fill="#4CAF50" />
  
  <!-- Sun dapples (pale yellow ovals) -->
  <ellipse cx="220" cy="620" rx="20" ry="15" fill="#FFF9C4" />
  <ellipse cx="470" cy="600" rx="20" ry="15" fill="#FFF9C4" />
  <ellipse cx="720" cy="630" rx="20" ry="15" fill="#FFF9C4" />
  <ellipse cx="970" cy="610" rx="20" ry="15" fill="#FFF9C4" />
  <ellipse cx="1220" cy="640" rx="20" ry="15" fill="#FFF9C4" />
  <ellipse cx="1420" cy="590" rx="20" ry="15" fill="#FFF9C4" />
  
  <!-- Rusted fence posts (7 vertical rectangles) -->
  <rect x="40" y="700" width="20" height="50" fill="#8B4513" />
  <rect x="120" y="700" width="20" height="50" fill="#8B4513" />
  <rect x="200" y="700" width="20" height="50" fill="#8B4513" />
  <rect x="280" y="700" width="20" height="50" fill="#8B4513" />
  <rect x="360" y="700" width="20" height="50" fill="#8B4513" />
  <rect x="440" y="700" width="20" height="50" fill="#8B4513" />
  <rect x="520" y="700" width="20" height="50" fill="#8B4513" />
  
  <!-- Rusted fence rail (horizontal bar) -->
  <rect x="0" y="720" width="600" height="20" fill="#8B4513" />
  
  <!-- Large ancient oak trunk -->
  <rect x="1100" y="250" width="100" height="600" fill="#5D4037" />
  
  <!-- Oak canopy (rounded mass) -->
  <ellipse cx="1150" cy="275" rx="150" ry="125" fill="#2E7D32" />
  
  <!-- Low oak branch extending leftward -->
  <rect x="950" y="300" width="250" height="30" fill="#5D4037" />
  
  <!-- Small distant clock tower -->
  <rect x="770" y="140" width="40" height="80" fill="#555" />
  <rect x="760" y="120" width="60" height="20" fill="#424242" /> <!-- tower cap -->
</svg>