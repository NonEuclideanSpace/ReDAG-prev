<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#f8f8f8"/>
  
  <!-- Red tennis ball -->
  <circle cx="180" cy="180" r="60" fill="#e53935"/>
  
  <!-- Green garden hose with nozzle -->
  <rect x="520" y="120" width="300" height="24" fill="#43a047"/>
  <rect x="820" y="108" width="36" height="36" fill="#2e7d32"/>
  
  <!-- Bicycle with wicker basket and wilted daisies -->
  <!-- Wheels -->
  <circle cx="1020" cy="220" r="48" fill="#000000"/>
  <circle cx="1220" cy="220" r="48" fill="#000000"/>
  <!-- Frame (simplified triangle + seat tube) -->
  <polygon points="1020,220 1120,140 1220,220" fill="#37474f"/>
  <line x1="1120" y1="140" x2="1120" y2="100" stroke="#37474f" stroke-width="12"/>
  <!-- Wicker basket (rounded rectangle) -->
  <rect x="1140" y="120" width="80" height="50" rx="10" ry="10" fill="#d7ccc8"/>
  <!-- Wilted daisies (4 small irregular ovals) -->
  <ellipse cx="1160" cy="145" rx="8" ry="16" fill="#ffcc00" transform="rotate(-20 1160 145)"/>
  <ellipse cx="1180" cy="150" rx="10" ry="12" fill="#ffcc00" transform="rotate(15 1180 150)"/>
  <ellipse cx="1200" cy="140" rx="7" ry="14" fill="#ffcc00" transform="rotate(-10 1200 140)"/>
  <ellipse cx="1190" cy="155" rx="9" ry="13" fill="#ffcc00" transform="rotate(25 1190 155)"/>
  
  <!-- Ivy-covered pickup truck (front hood focus) -->
  <!-- Hood trapezoid -->
  <polygon points="180,640 460,640 420,720 220,720" fill="#558b2f"/>
  <!-- Headlights -->
  <circle cx="240" cy="660" r="12" fill="#ffffff"/>
  <circle cx="400" cy="660" r="12" fill="#ffffff"/>
  <!-- Grille -->
  <rect x="280" y="670" width="120" height="8" fill="#000000"/>
  <!-- Ivy accents (4 small circles) -->
  <circle cx="210" cy="650" r="6" fill="#33691e"/>
  <circle cx="260" cy="630" r="5" fill="#33691e"/>
  <circle cx="370" cy="625" r="6" fill="#33691e"/>
  <circle cx="430" cy="655" r="5" fill="#33691e"/>
  
  <!-- Drone -->
  <!-- Body -->
  <circle cx="1280" cy="660" r="24" fill="#b0bec5"/>
  <!-- Arms -->
  <rect x="1268" y="636" width="24" height="48" fill="#b0bec5"/>
  <rect x="1268" y="636" width="48" height="24" fill="#b0bec5" transform="rotate(90 1292 648)"/>
  <rect x="1268" y="636" width="48" height="24" fill="#b0bec5" transform="rotate(-90 1292 648)"/>
  <rect x="1268" y="636" width="24" height="48" fill="#b0bec5" transform="rotate(180 1280 660)"/>
  <!-- Rotors -->
  <circle cx="1280" cy="612" r="8" fill="#ffffff"/>
  <circle cx="1316" cy="648" r="8" fill="#ffffff"/>
  <circle cx="1280" cy="684" r="8" fill="#ffffff"/>
  <circle cx="1244" cy="648" r="8" fill="#ffffff"/>
</svg>