<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="white"/>

  <!-- LEFT CLUSTER -->
  <!-- Woman (bending): simplified torso, arm, head -->
  <rect x="180" y="480" width="40" height="160" fill="#2c3e50" />
  <line x1="200" y1="520" x2="290" y2="520" stroke="#3498db" stroke-width="12" stroke-linecap="round"/>
  <circle cx="200" cy="460" r="20" fill="#2c3e50" />

  <!-- Hose nozzle -->
  <rect x="280" y="510" width="30" height="30" fill="#7f8c8d" />

  <!-- Water arc (blue cubic Bézier) -->
  <path d="M 295 525 C 380 420, 480 380, 570 440" fill="none" stroke="#3498db" stroke-width="8" stroke-linecap="round"/>

  <!-- Bicycle -->
  <circle cx="430" cy="680" r="32" fill="none" stroke="black" stroke-width="6"/>
  <circle cx="510" cy="680" r="32" fill="none" stroke="black" stroke-width="6"/>
  <polygon points="430,648 470,580 510,648 470,620" fill="none" stroke="gray" stroke-width="6"/>

  <!-- Fence segment -->
  <rect x="490" y="550" width="8" height="120" fill="#27ae60"/>
  <rect x="510" y="550" width="8" height="120" fill="#27ae60"/>
  <rect x="530" y="550" width="8" height="120" fill="#27ae60"/>
  <rect x="490" y="540" width="50" height="10" fill="#27ae60"/>

  <!-- RIGHT CLUSTER -->
  <!-- Oak trunk -->
  <rect x="1000" y="480" width="40" height="240" fill="#27ae60"/>

  <!-- Low oak branch -->
  <line x1="1000" y1="480" x2="1050" y2="410" stroke="#27ae60" stroke-width="12" stroke-linecap="round"/>

  <!-- Terrier digging -->
  <ellipse cx="1080" cy="640" rx="30" ry="20" fill="#9b59b6"/>
  <circle cx="1070" cy="620" r="12" fill="black"/>

  <!-- Pickup truck -->
  <rect x="1180" y="420" width="300" height="120" rx="12" ry="12" fill="gray"/>
  <!-- Hood detail -->
  <rect x="1180" y="420" width="180" height="40" rx="6" ry="6" fill="#95a5a6"/>

  <!-- Cat on hood -->
  <circle cx="1290" cy="440" r="20" fill="#f39c12"/>

  <!-- Tennis ball -->
  <circle cx="1275" cy="618" r="17.5" fill="#e74c3c"/>

  <!-- Ladybug chain: 6 segmented ovals along curved path -->
  <!-- Path approximated as smooth curve from (1050,410) to (1275,618) -->
  <ellipse cx="1075" cy="445" rx="6" ry="4" fill="#e74c3c"/>
  <ellipse cx="1105" cy="475" rx="6" ry="4" fill="#e74c3c"/>
  <ellipse cx="1135" cy="505" rx="6" ry="4" fill="#e74c3c"/>
  <ellipse cx="1165" cy="535" rx="6" ry="4" fill="#e74c3c"/>
  <ellipse cx="1195" cy="565" rx="6" ry="4" fill="#e74c3c"/>
  <ellipse cx="1230" cy="595" rx="6" ry="4" fill="#e74c3c"/>
  <!-- Black spots -->
  <circle cx="1072" cy="443" r="1.5" fill="black"/>
  <circle cx="1078" cy="447" r="1.5" fill="black"/>
  <circle cx="1102" cy="473" r="1.5" fill="black"/>
  <circle cx="1108" cy="477" r="1.5" fill="black"/>
  <circle cx="1132" cy="503" r="1.5" fill="black"/>
  <circle cx="1138" cy="507" r="1.5" fill="black"/>
  <circle cx="1162" cy="533" r="1.5" fill="black"/>
  <circle cx="1168" cy="537" r="1.5" fill="black"/>
  <circle cx="1192" cy="563" r="1.5" fill="black"/>
  <circle cx="1198" cy="567" r="1.5" fill="black"/>
  <circle cx="1227" cy="593" r="1.5" fill="black"/>
  <circle cx="1233" cy="597" r="1.5" fill="black"/>

  <!-- Drone (cross shape) -->
  <line x1="1195" y1="150" x2="1205" y2="150" stroke="#7f8c8d" stroke-width="4"/>
  <line x1="1200" y1="145" x2="1200" y2="155" stroke="#7f8c8d" stroke-width="4"/>
</svg>