default: qwen_remote
providers:
  qwen_remote:
    protocol: qwen_remote
    base_url: ${QWEN_IMAGE_BASE_URL}
    api_key: ${QWEN_IMAGE_API_KEY}
    model: ${QWEN_IMAGE_MODEL_NAME}
  gemini_openai:
    protocol: openai_chat
    base_url: ${GEMINI_BASE_URL}
    api_key: ${GEMINI_API_KEY}
    model: ${GEMINI_I2I_MODEL_NAME}
