default: flux_remote
providers:
  flux_remote:
    protocol: flux_remote
    base_url: ${FLUX_BASE_URL}
    api_key: ${FLUX_API_KEY}
    model: ${FLUX_MODEL_NAME}
  gemini_openai:
    protocol: openai_chat
    base_url: ${GEMINI_BASE_URL}
    api_key: ${GEMINI_API_KEY}
    model: ${GEMINI_I2I_MODEL_NAME}
